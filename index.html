<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>seungjae99</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      padding: 60px 16px 100px;
    }
    .page {
      max-width: 760px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 56px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #e6edf3;
      margin-bottom: 8px;
    }
    .header p {
      color: #8b949e;
      font-size: 15px;
    }
    .header a {
      color: #58a6ff;
      text-decoration: none;
    }
    .header a:hover {
      text-decoration: underline;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 16px;
    }
    .projects {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-decoration: none;
      transition: border-color 0.15s;
    }
    .card:hover {
      border-color: #58a6ff;
    }
    .card-body {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 13px;
      color: #8b949e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-tags {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .tag {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      background: #2d3148;
      color: #8b949e;
      white-space: nowrap;
    }
    .arrow {
      color: #444d5a;
      font-size: 16px;
      flex-shrink: 0;
    }
    .loading {
      color: #8b949e;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>seungjae99</h1>
      <p>Project reports and system overviews. Source on <a href="https://github.com/seungjae99" target="_blank">GitHub</a>.</p>
    </div>
    <div class="section-label">Projects</div>
    <div class="projects" id="projects">
      <span class="loading">Loading projects...</span>
    </div>
  </div>

  <script>
    // ── 프로젝트 목록 ──────────────────────────────────────────
    // 새 프로젝트 추가할 때 여기에만 이름 추가하면 끝
    const REPOS = [
      "rl_kill_switch",
      "makemore_benchmark",
    ];
    // ──────────────────────────────────────────────────────────

    const USERNAME = "seungjae99";

    function cardHTML(repo, meta) {
      const url = `https://${USERNAME}.github.io/${repo}/`;
      const tags = (meta.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
      return `
        <a class="card" href="${url}">
          <div class="card-body">
            <div class="card-title">${repo}</div>
            <div class="card-desc">${meta.desc || ""}</div>
          </div>
          <div class="card-tags">${tags}</div>
          <span class="arrow">&#8250;</span>
        </a>
      `;
    }

    async function fetchMeta(repo) {
      const url = `https://${USERNAME}.github.io/${repo}/meta.json`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("not found");
        return await res.json();
      } catch {
        // meta.json 없으면 빈 메타로 카드는 그냥 표시
        return { desc: "", tags: [] };
      }
    }

    async function render() {
      const container = document.getElementById("projects");
      const results = await Promise.all(
        REPOS.map(async (repo) => {
          const meta = await fetchMeta(repo);
          return cardHTML(repo, meta);
        })
      );
      container.innerHTML = results.join("");
    }

    render();
  </script>
</body>
</html>
