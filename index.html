<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>seungjae99</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface-hover: #161a22;
      --border: #1e2230;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #4493f8;
      --tag-bg: #161a22;
      --tag-text: #6e7681;
    }

    body {
      background: var(--bg);
      color: var(--text-secondary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.7;
      padding: 80px 20px 120px;
    }

    .page { max-width: 680px; margin: 0 auto; }

    /* ── Profile ── */
    .profile {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      margin-bottom: 64px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -1px;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .profile-body h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .profile-body p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 16px;
      max-width: 480px;
    }

    .profile-links { display: flex; gap: 16px; margin-bottom: 12px; }

    .profile-links a {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s;
    }

    .profile-links a:hover { color: var(--accent); }

    .profile-links a svg { width: 14px; height: 14px; }

    .profile-contact {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .profile-contact a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s;
    }

    .profile-contact a:hover { color: var(--accent); }

    .profile-contact svg { width: 14px; height: 14px; }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* ── Cards ── */
    .projects {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .card {
      background: var(--surface);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-decoration: none;
      transition: background 0.12s;
      border-bottom: 1px solid var(--border);
    }

    .card:last-child { border-bottom: none; }
    .card:hover { background: var(--surface-hover); }
    .card:hover .arrow { color: var(--accent); transform: translateX(2px); }

    .card-body { flex: 1; min-width: 0; }

    .card-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 3px;
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .card-tags { display: flex; gap: 5px; }

    .tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid var(--border);
      white-space: nowrap;
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
    }

    .arrow {
      color: var(--text-muted);
      font-size: 16px;
      transition: color 0.12s, transform 0.12s;
    }

    .loading {
      padding: 24px 22px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="profile">
      <div class="avatar" id="avatar">SJ</div>
      <div class="profile-body">
        <h1>Seungjae Choi</h1>
        <p>Interested in Mobile Robotics and Deep Learning<br>Projects in ROS, deep learning, and autonomous systems.</p>
        
        <div class="profile-links">
          <a href="https://github.com/seungjae99" target="_blank">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            GitHub
          </a>
          <a href="https://jason1999.tistory.com/" target="_blank">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            Blog
          </a>
        </div>

        <div class="profile-contact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <a href="mailto:seungjaechoi9@gmail.com">seungjaechoi9@gmail.com</a>
        </div>

      </div>
    </div>

    <div class="section-label">Projects</div>
    <div class="projects" id="projects">
      <div class="loading">Loading...</div>
    </div>

    <div class="footer">
      Updated automatically · Source on <a href="https://github.com/seungjae99" target="_blank">GitHub</a>
    </div>

  </div>

  <script>
    // ── 새 프로젝트는 여기에만 추가 ──────────────────────────
    const REPOS = [
      "rl_kill_switch",
      "makemore_benchmark",
    ];
    // ────────────────────────────────────────────────────────

    const USERNAME = "seungjae99";

    const avatarEl = document.getElementById("avatar");
    const img = document.createElement("img");
    img.src = `https://github.com/${USERNAME}.png`;
    img.onload = () => { avatarEl.innerHTML = ""; avatarEl.appendChild(img); };

    function cardHTML(repo, meta) {
      const url = `https://${USERNAME}.github.io/${repo}/`;
      const tags = (meta.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
      return `
        <a class="card" href="${url}">
          <div class="card-body">
            <div class="card-title">${repo}</div>
            <div class="card-desc">${meta.desc || ""}</div>
          </div>
          <div class="card-right">
            <div class="card-tags">${tags}</div>
            <span class="arrow">›</span>
          </div>
        </a>
      `;
    }

    async function fetchMeta(repo) {
      try {
        const res = await fetch(`https://${USERNAME}.github.io/${repo}/meta.json`);
        if (!res.ok) throw new Error();
        return await res.json();
      } catch {
        return { desc: "", tags: [] };
      }
    }

    async function render() {
      const container = document.getElementById("projects");
      const results = await Promise.all(
        REPOS.map(async (repo) => cardHTML(repo, await fetchMeta(repo)))
      );
      container.innerHTML = results.join("");
    }

    render();
  </script>
</body>
</html>
